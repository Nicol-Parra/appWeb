<div class="container">
  <h2>Crear cuenta</h2>

  <form>

    <div class="grupo">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="nombre" name="nombre">
    </div>

    <div class="grupo">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email">
    </div>

    <div class="grupo">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password">
    </div>

    <button type="button" (click)="registrar()">
      Registrarse
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>
  </form>

        <div class="register-link">
        ¿Ya tienes cuenta? <span (click)="goToIngresar()">Ingresar</span>
      </div>
</div>
